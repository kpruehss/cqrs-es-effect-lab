services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cqrs_es_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pg-data:/var/lib/postgresql/data
volumes:
  pg-data:
